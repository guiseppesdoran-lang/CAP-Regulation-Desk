name: Build standalone Windows app
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6,<7"
      - name: Validate application
        run: python -m unittest test_server.py
      - name: Build independent executable
        run: python build_executable.py
      - uses: actions/upload-artifact@v4
        with:
          name: CAP-Regulation-Desk-Windows
          path: release/CAP-Regulation-Desk.exe
          retention-days: 30
